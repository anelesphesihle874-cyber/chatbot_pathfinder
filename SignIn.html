
{% extends "base.html" %}

{% block title %}
Sign In - PathFinder
{% endblock %}

{% block body %}

<link rel="stylesheet" href="{{url_for('static', filename='signin.css')}}">

<div class="signin-container">

    <form class="signin-form" action="{{ url_for('signin') }}" method="post">

        <h2>Sign In</h2>

        <p class="subtitle">
            Welcome back to PathFinder
        </p>

        <input
            type="email"
            placeholder="Enter your email"
            name="email"
            required
        >

        <input
            type="password"
            placeholder="Enter your password"
            name="password"
            required
        >

        <button type="submit" class="sign_btn">
            Sign In
        </button>

        <p class="account-text">
            You don't have an account?
        </p>

        <a href="{{ url_for('SignUp') }}" class="signup-link">
            Create an account
        </a>

    </form>

</div>

{% endblock %}
