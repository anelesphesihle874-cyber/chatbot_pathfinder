
{% extends "base.html" %}

{% block title %}
Sign Up - PathFinder
{% endblock %}

{% block body %}

<link rel="stylesheet"
      href="{{ url_for('static', filename='signup.css') }}">

<div class="signup-container">

    <form class="signup-form"
          action="{{ url_for('signup') }}"
          method="post">

        <h2>Sign Up</h2>

        <p class="subtitle">
            Create your PathFinder account
        </p>

        <input
            type="text"
            placeholder="Enter your name"
            name="name"
            required
        >

        <input
            type="email"
            placeholder="Enter your email"
            name="email"
            required
        >

        <input
            type="tel"
            placeholder="Enter your phone number"
            name="phone_no"
            required
        >

        <input
            type="password"
            placeholder="Enter your password"
            name="password"
            required
        >

        <input
            type="password"
            placeholder="Confirm your password"
            name="confirm_password"
            
        >

        <button type="submit" class="sign_btn">
            Sign Up
        </button>

        <p class="account-text">
            Already have an account?
        </p>

        <a href="{{ url_for('SignIn') }}" class="signin-link">
            Sign In
        </a>

    </form>

</div>

{% endblock %}
