
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        PathFinder
        {% endblock %}
    </title>

    <style>


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f7fb;
            color: #333;

            height: 100vh;
            overflow: hidden;
        }


        .app-container {
            display: flex;

            height: 100vh;
            width: 100%;
        }


        .sidebar {
            width: 250px;

            height: 100vh;

            background-color: #0066ff;

            color: white;

            padding: 25px 20px;

            display: flex;
            flex-direction: column;
        }


        .logo-area {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 35px;
        }

        .logo {
            width: 45px;
            height: 45px;

            background-color: white;

            color: #0066ff;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;

            font-size: 17px;
        }

        .logo-name {
            font-size: 21px;

            font-weight: bold;
        }


        .new-chat {
            width: 100%;

            padding: 12px;

            border: 2px solid white;

            background-color: transparent;

            color: white;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

            margin-bottom: 25px;

            transition: 0.3s;
        }

        .new-chat:hover {
            background-color: white;

            color: #0066ff;
        }


        .history-title {
            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 12px;

            opacity: 0.8;
        }

        .history {
            flex: 1;

            overflow-y: auto;
        }

        .history-item {
            display: block;

            padding: 11px;

            margin-bottom: 5px;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 14px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition: 0.3s;
        }

        .history-item:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }



        .logout {
            margin-top: auto;

            padding-top: 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logout a {
            display: block;

            padding: 12px;

            text-align: center;

            background-color: #ffd21f;

            color: #222;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;
        }

        .logout a:hover {
            background-color: #e6b900;
        }


        .main-area {
            flex: 1;

            display: flex;

            flex-direction: column;

            min-width: 0;
        }

        .topbar {
            height: 70px;

            background-color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            border-bottom: 1px solid #e5e5e5;
        }

        .welcome h1 {
            font-size: 22px;

            color: #333;
        }


        .profile {
            display: flex;

            align-items: center;

            gap: 10px;

            cursor: pointer;
        }

        .profile-icon {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background-color: #0066ff;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;
        }


        .content {
            flex: 1;

            padding: 30px;

            overflow-y: auto;
        }


        @media (max-width: 700px) {

            .sidebar {
                width: 200px;

                padding: 20px 15px;
            }

            .logo-name {
                font-size: 18px;
            }

            .topbar {
                padding: 0 20px;
            }

            .content {
                padding: 20px;
            }
        }

    </style>

</head>


<body>

<div class="app-container">


    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo-area">

            <div class="logo">
                PF
            </div>

            <div class="logo-name">
                PathFinder
            </div>

        </div>


        <!-- New Chat -->
        <button class="new-chat">
            + New Chat
        </button>


        <!-- History -->
        <div class="history-title">
            History
        </div>

        <div class="history">

            <a href="#" class="history-item">
                Computer Science requirements
            </a>

            <a href="#" class="history-item">
                Courses I qualify for
            </a>

            <a href="#" class="history-item">
                Bachelor of Education
            </a>

        </div>


        <!-- Logout -->
        <div class="logout">

            <a href="{{url_for('logout')}}">
             
                Logout
            </a>

        </div>

    </aside>


    <div class="main-area">


        <!-- Top Bar -->
        <header class="topbar">

            <div class="welcome">

                <h1>
                    Welcome
                </h1>

            </div>


            <div class="profile">

                <div class="profile-icon">
                    U
                </div>

                <span>
                    Profile
                </span>

            </div>

        </header>


        <!-- Page Content -->
        <main class="content">

            {% block body %}
            {% endblock %}

        </main>


    </div>

</div>

</body>

</html>
